AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ClimateLens FastAPI backend on AWS Lambda + HTTP API

Parameters:
  S3BucketName:
    Type: String
    Description: Existing S3 bucket that stores weather JSON files

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.12
    Architectures:
      - x86_64

Resources:
  ClimateLensHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - "*"

  ClimateLensFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        RequirementsFile: requirements-lambda.txt
    Properties:
      CodeUri: .
      Handler: lambda_handler.handler
      Description: ClimateLens weather API
      Environment:
        Variables:
          AWS_S3_BUCKET: !Ref S3BucketName
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ClimateLensHttpApi
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ClimateLensHttpApi
            Path: /
            Method: ANY

Outputs:
  ApiUrl:
    Description: Public API base URL (set NEXT_PUBLIC_API_BASE_URL to this)
    Value: !Sub "https://${ClimateLensHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  FunctionName:
    Description: Lambda function name
    Value: !Ref ClimateLensFunction
